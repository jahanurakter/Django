{% extends 'master/layout.html' %}


{% block title %}
    Home Page
{% endblock title %}
    

{% block body %}
<h3>This is student table</h3>
 <table class="table table-striped">
    <thead>
            <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Section</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                   {% for data in title  %}
                    <td>{{data.name}}</td>
                    <td>{{data.roll}}</td>
                    <td>{{data.section}}</td>
                   {% endfor %}
            </tr>
        </tbody>
  </table>
    <p>This is homepage</p>
{% endblock body %}
