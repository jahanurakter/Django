<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Register Page</title>
  </head>
  <body>
    <div class="container">
   <form method="POST">
    {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">User Name</label>
    <input type="text" name="username" class="form-control" placeholder="Enter user name">
  </div>
 <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Email</label>
    <input type="email" name="email" class="form-control" placeholder="Enter user email">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Student Name</label>
    <input type="text" name="student_name" class="form-control" placeholder="Enter student name">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Student Id</label>
    <input type="text" name="student_id" class="form-control" placeholder="Enter student id">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" name="password" class="form-control" placeholder="Enter password">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Confirm Password</label>
    <input type="password" name="conf_password" class="form-control" placeholder="Enter name">
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
  <a href="{% url 'login_view' %}">Already have an account ?</a>
</form>
</div>
  </body>
</html>
