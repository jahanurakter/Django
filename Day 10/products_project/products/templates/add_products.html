{% extends 'master/base.html' %}


{% block title %}
    Add Products
{% endblock title %}


{% block content %}
    <h2>Add Products</h2>
<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Home</label>
    <input type="text" name="home" class="form-control" id="exampleInputPassword1" placeholder="Enter your name">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Product Description</label>
    <textarea name="description" class="form-control" id="exampleInputPassword1"></textarea>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Price</label>
    <input type="number" name="price" class="form-control" id="exampleInputPassword1" placeholder="Product price">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Product Date</label>
    <input type="date" name="date" class="form-control" id="exampleInputPassword1" placeholder="Product Date">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Image</label>
    <input type="file" name="image" class="form-control" id="exampleInputPassword1" placeholder="Enter your image">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock content %}
