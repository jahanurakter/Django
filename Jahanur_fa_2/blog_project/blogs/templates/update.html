{% extends 'master/base.html' %}



{% block title %}
    update blogpost
{% endblock title %}


{% block content %}  
<div>
    <form method='POST' enctype="multipart/form-data">
    {% csrf_token %}
    <h3>Blog Post Update</h3>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Title</label>
    <input type="text" name='title' value="{{blog_data.title}}" class="form-control" placeholder="Enter your title">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Author Name</label>
    <input type="text" name='author_name' value="{{blog_data.author_name}}" class="form-control" placeholder="Enter your author_name">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Content</label>
    <textarea name="content" class="form-control" placeholder="Enter Content here">{{blog_data.content}}</textarea>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Category</label>
    <select name="category" class="form-select" aria-label="Default select example">
  <option value="Educational"
  {% if blog_data.category == 'Educational'%}
    selected
  {% endif %}
    >Educational</option>
  <option value="Technologies"
    {% if blog_data.category == 'Technologies'%}
    selected
  {% endif %}>Technologies</option>
  <option value="Sports"
    {% if blog_data.category == 'Sports'%}
    selected
  {% endif %}>Sports</option>
</select>
  </div>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Blog Image</label>
    <input type="file" name='blog_image' class="form-control" placeholder="Enter blog image">     
     {% if blog_data.blog_image %}
        <img src="{{blog_data.blog_image.url}}" width="50px" alt="">
        {% else %}
        No Preview
    {% endif %}
</div>
  <button type="submit" class="btn btn-primary">Update Blog</button>
</form>
</div>  

{% endblock content %}
