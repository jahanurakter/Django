{% extends 'master/base.html' %}



{% block title %}
    blogpost
{% endblock title %}


{% block content %}  
<div>
    <form method='POST' enctype="multipart/form-data">
    {% csrf_token %}
    <h3>Blog Post Here</h3>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Title</label>
    <input type="text" name='title' class="form-control" placeholder="Enter your title">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Author Name</label>
    <input type="text" name='author_name' class="form-control" placeholder="Enter your author_name">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Content</label>
    <textarea name="content" class="form-control" placeholder="Enter Content here"></textarea>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Category</label>
    <select name="category" class="form-select" aria-label="Default select example">
  <option value="Educational">Educational</option>
  <option value="Technologies">Technologies</option>
  <option value="Sports">Sports</option>
</select>
  </div>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Blog Image</label>
    <input type="file" name='blog_image' class="form-control" placeholder="Enter blog image">     
</div>
  <button type="submit" class="btn btn-primary">Add Blog</button>
</form>
</div>  

{% endblock content %}
