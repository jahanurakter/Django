{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block title %}
  {{ form_page }}
{% endblock %}

{% block body %}
  <h1>{{ form_title }}</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form_data|crispy }}
    <button type="submit" class="btn btn-primary">{{ form_btn }}</button>
  </form>

  {% if extra_link %}
    <p>
      <a href="{{ extra_link }}">{{ extra_text }}</a>
    </p>
  {% endif %}
{% endblock %}
