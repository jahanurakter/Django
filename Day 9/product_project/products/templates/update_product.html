{% extends 'master/layout.html' %}


{% block title %}
    Update Prodcuts
{% endblock title %}


{% block body %}
<h1>Update Product Info</h1>
<div>
    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Name</label>
    <input type="text" name="name" value="{{pro_data.name}}" class="form-control" id="exampleInputEmail1" placeholder="Enter product name">
    </div>
    <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Product Description</label>
    <textarea name="description" class="form-control" id="exampleInputEmail1" placeholder="Enter production_date">{{pro_data.description}}</textarea>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Production Date</label>
    <input type="date" name="date" value="{{pro_data.production_date|date:'Y-m-d'}}" class="form-control" id="exampleInputEmail1" placeholder="Enter production_date">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Price</label>
    <input type="number" name="price" value="{{pro_data.price}}" class="form-control" id="exampleInputEmail1" placeholder="Enter product price">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Image</label>
    <input type="file" name="image" class="form-control" id="exampleInputEmail1" placeholder="Enter product image">
    {% if pro_data.image %}
        <img src="/{{pro_data.image}}" width="50 px" alt="" />
        {% else %}
                NO Preview
        {% endif %}
    </div>
  <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock body %}
