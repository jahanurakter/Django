{% extends 'master/layout.html' %}


{% block title %}
    Delete Prodcuts
{% endblock title %}


{% block body %}
<h1>Delete Product Info</h1>
<div>
    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Name</label>
    <input type="text" name="name" class="form-control" id="exampleInputEmail1" placeholder="Enter product name">
    </div>
    <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Product Description</label>
    <input type="text" name="description" class="form-control" id="exampleInputEmail1" placeholder="Enter production_date">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Production Date</label>
    <input type="date" name="date" class="form-control" id="exampleInputEmail1" placeholder="Enter production_date">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Price</label>
    <input type="number" name="price" class="form-control" id="exampleInputEmail1" placeholder="Enter product price">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Image</label>
    <input type="image" name="image" class="form-control" id="exampleInputEmail1" placeholder="Enter product image">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock body %}
