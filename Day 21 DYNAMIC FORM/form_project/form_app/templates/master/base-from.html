{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    {{form_page}}
{% endblock title %}

{% block content %}
    <h3>{{form_title}}</h3>
    <form method="POST">
        {% csrf_token %}
        {{form_data|crispy}}
        
        <button type="submit" class="btn btn-success">{{form_btn}}</button>
    </form>
{% endblock content %}
