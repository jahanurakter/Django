{% extends 'master/base.html' %}


{% block title %}
    Add Products Page
{% endblock title %}


{% block content %}
<div class="container my-5 d-flex justify-content-center">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 700px; border-radius: 10px;">
        
    <h3>Add Products</h2>
<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Name</label>
    <input type="text" name="name" class="form-control" id="exampleInputEmail1" placeholder="Enter product name">
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Description</label>
    <textarea name="description" class="form-control" id="exampleInputEmail1" placeholder="Product Description"></textarea>
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Price</label>
    <input type="number" name="price" class="form-control" id="exampleInputEmail1" placeholder="Product Price">
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Date</label>
    <input type="date" name="date" class="form-control" id="exampleInputEmail1" placeholder="Product Date">
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Image</label>
    <input type="file" name="image" class="form-control" id="exampleInputEmail1" placeholder="Enter Image">
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
</div>

{% endblock content %}
