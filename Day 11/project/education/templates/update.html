{% extends 'master/base.html' %}


{% block title %}
    Student Update Info
{% endblock title %}


{% block content %}
    <h2 class="text-center">Student Update</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Student Name</label>
    <input type="text" name="name" value="{{data.stu_name}}" class="form-control" id="exampleInputEmail1" placeholder="Enter Student Name"> 
  </div>
  
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Student Image</label>
    <input type="file" name="image" class="form-control" id="exampleInputEmail1" placeholder="Enter Student Image"> 
    {% if data.stu_image %}
           <img src="/{{data.stu_image}}" width="50px" alt="">
         {% else %}
           No Preview
         {% endif %}
   </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Admission Date</label>
    <input type="date" name="date" value="{{data.admission_date|date:'Y-m-d'}}" class="form-control" id="exampleInputEmail1" placeholder="Enter Admission Date"> 
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Course Name</label>
    <input type="text" name="course_name" value="{{data.course_name}}" class="form-control" id="exampleInputEmail1" placeholder="Enter Course Name"> 
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Course Fee</label>
    <input type="number" name="course_fee" value="{{data.course_fee}}" class="form-control" id="exampleInputEmail1" placeholder="Course Fee"> 
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>   
{% endblock content %}
