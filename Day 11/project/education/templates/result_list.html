{% extends 'master/base.html' %}


{% block title %}
    Result Information
{% endblock title %}

{% block content %}
    <h2 class="text-center">Result Information</h2>
    
    <table class="table table-striped">
        <thead>
            <tr>
            <th>Name</th>
            <th>Marks</th>
            <th>Grade</th>
           
            </tr>
        </thead>
        <tbody>
  
            {% for data in result_data %}
                <tr>
                <td>{{data.stu_name}}</td>
                <td>{{data.marks}}</td>
                <td>{{data.grade}}</td>
                <td><a href="{% url 'delete_result' data.id %}">Delete</a></td>
                <td><a href="{% url 'update_result' data.id %}">Edit</a></td>
               
                </tr>
            {% endfor %}
           
        </tbody>
    </table>
{% endblock content %}
