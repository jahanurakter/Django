<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>projectadd</title>
  </head>
  <body>
    <div class="container">
        <h1 class="text-center">Add Student Project</h1>
   <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Project Name</label>
    <input type="text" name="project_name" value="{{project_data.project_name}}" class="form-control" placeholder="Enter Project name">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Project Description</label>
    <textarea name="project_description" class="form-control" placeholder="Project describe here">{{project_data.project_description}}</textarea>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Project Image</label>
    <input type="file" name="project_image" class="form-control" placeholder="Enter Project Image">
    
    {% if project_data.project_image %}
        <img src="{{project_data.project_image.url}}" width="50px" alt="">
        {% else %}
        No Preview
    {% endif %}
        
    </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Project Status</label>
    <select name="project_status" class="form-select" >
    
  <option value="NotStarted"{% if data.project_status == 'NotStarted' %}
    selected
  {% endif %}>NotStarted</option>
  <option value="InProgress"
  {% if data.project_status == 'InProgress' %}
    selected
  {% endif %}>In Progress</option>
  <option value="Completed"
  {% if data.project_status == 'Completed' %}
    selected
  {% endif %}>Completed</option>
</select>
  </div>
  <button type="submit" class="btn btn-primary">Update Project</button>

</form>
</div>
  </body>
</html>
