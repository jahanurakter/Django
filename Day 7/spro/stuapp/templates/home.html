{% extends 'master/layout.html' %}


{% block title %}
    Home page
{% endblock title %}


{% block body %}
    <h3>This is Our Home</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>Email</th>
                <th>Age</th>
            </tr>
        </thead>
            <tbody>
                {% for x in stu %}
                    <tr>
                        <td>{{x.name}}</td>
                        <td>{{x.address}}</td>
                        <td>{{x.email}}</td>
                        <td>{{x.age}}</td>
                    </tr>
                {% endfor %}
            </tbody>
    </table>
{% endblock body %}
