{% extends 'master/layout.html' %}


{% block title0 %}
    Student Add
{% endblock title0 %}
    

{% block body %}

<form method="POST">
    {% csrf_token %}
    <h3>Add Student</h3>
    <div class="container">
        <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Name</label>
  <input type="text" name="name" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>

 <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Address</label>
  <input type="text" name="address" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>
 <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Email</label>
  <input type="email" name="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>
 <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Age</label>
  <input type="number" name="age" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>
<button type="submit" class="btn btn-primary">Add Student</button>
</div>
</form>
{% endblock body %}
